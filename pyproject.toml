[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpath-prrs"
version = "0.1.0"
description = "Perturbation-response reaction discovery with ASE calculators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ase>=3.23,<4", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
mace = ["mace-torch>=0.3.10,<0.4"]

[project.scripts]
prrs = "prrs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# 96, not 88. The prose in this codebase is load-bearing -- docstrings carry the
# measurements that justify the defaults -- and at 88 those paragraphs rewrap into
# noise. Installed in .venv-tools, deliberately outside the openmm_dev science
# environment: `python -m venv .venv-tools && .venv-tools/bin/pip install ruff`.
# Formatting must never be a reason for that environment to move.
line-length = 96
extend-exclude = [".venv", ".venv-tools", "runs", "docs/design"]

[tool.ruff.lint]
# Pyflakes and the pycodestyle errors only. No import sorting: the import blocks here
# are grouped by layer, and isort would flatten that into alphabetical order.
select = ["E", "F", "W"]
ignore = ["E501"]   # the formatter owns line length; the linter must not second-guess it
