[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpath-prrs"
version = "0.1.0"
description = "Perturbation-response reaction discovery with ASE calculators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ase>=3.23,<4", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
mace = ["mace-torch>=0.3.10,<0.4"]

[project.scripts]
prrs = "prrs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

